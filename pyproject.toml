[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "sein-zum-tode"
version = "0.1.0"
description = "Telegram bot service built with Temporal"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiogram==3.30.0",
    "asyncpg==0.31.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "redis==8.0.1",
    "SQLAlchemy==2.0.51",
    "temporalio==1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.22",
]

[project.scripts]
sein-zum-tode = "sein_zum_tode.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

