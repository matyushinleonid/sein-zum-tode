[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "sein-zum-tode"
version = "0.1.0"
description = "Telegram bot service built with Temporal"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.18.4",
    "aiogram==3.30.0",
    "asyncpg==0.31.0",
    "Babel==2.17.0",
    "cron-descriptor==2.1.0",
    "cronsim==2.7",
    "httpx[socks]==0.28.1",
    "num2words==0.5.14",
    "openai==2.52.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "prometheus-client==0.26.0",
    "PyYAML==6.0.3",
    "redis==8.0.1",
    "SQLAlchemy==2.0.51",
    "temporalio==1.30.0",
    "yandex-ai-studio-sdk==0.22.0",
]

[project.optional-dependencies]
dev = [
    "coverage==7.15.2",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "ruff==0.16.0",
    "types-PyYAML==6.0.12.20260518",
]

[project.scripts]
sein-zum-tode = "sein_zum_tode.main:main"
sein-zum-tode-worker = "sein_zum_tode.worker:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--cov=sein_zum_tode",
    "--cov-report=term-missing:skip-covered",
]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "fast: isolated test expected to finish within 100 milliseconds",
    "deep: integration test that exercises multiple production components",
]

[tool.coverage.run]
source = ["sein_zum_tode"]
omit = [
    "src/sein_zum_tode/__init__.py",
    "src/sein_zum_tode/config.py",
    "src/sein_zum_tode/log_config.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    'if __name__ == "__main__":',
]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
mypy_path = ["src"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["cron_descriptor"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/support.py" = ["ASYNC109"]
