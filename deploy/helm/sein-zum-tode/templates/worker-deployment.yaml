apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sein-zum-tode.fullname" . }}-worker
  labels:
    {{- include "sein-zum-tode.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.workerReplicaCount }}
  selector:
    matchLabels:
      {{- include "sein-zum-tode.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        checksum/bot-content: {{ include (print $.Template.BasePath "/bot-content-configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "sein-zum-tode.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: telegram-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -m
            - sein_zum_tode.worker
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
          startupProbe:
            httpGet:
              path: /metrics
              port: metrics
            failureThreshold: 30
            periodSeconds: 2
          {{- end }}
          env:
            - name: APP_NAME
              value: {{ printf "%s-worker" (include "sein-zum-tode.name" .) | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.application.logLevel | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.application.logFormat | quote }}
            - name: METRICS_HOST
              value: {{ .Values.metrics.host | quote }}
            - name: METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            - name: TELEGRAM_UPDATE_TTL_SECONDS
              value: {{ .Values.application.telegramUpdateTtlSeconds | quote }}
            - name: UNSUPPORTED_UPDATE_SESSION_TTL_SECONDS
              value: {{ .Values.application.unsupportedUpdateSessionTtlSeconds | quote }}
            - name: TELEGRAM_ADMIN_USER_IDS
              value: {{ .Values.application.telegramAdminUserIds | toJson | quote }}
            - name: QUESTIONNAIRE_TTL_SECONDS
              value: {{ .Values.application.questionnaireTtlSeconds | quote }}
            - name: BOT_CONTENT_PATH
              value: /app/config/bot-content.yaml
            - name: DEATH_PREDICTION_CONFIG_PATH
              value: /app/config/death-prediction.yaml
            - name: NOTIFICATION_SCHEDULE_CONFIG_PATH
              value: /app/config/notification-schedule.yaml
            {{- if or (eq .Values.deathPrediction.config.provider "yandex") (eq .Values.notificationSchedule.config.provider "yandex") }}
            - name: YANDEX_AI_STUDIO_FOLDER_ID
              value: {{ required "yandexAiStudio.folderId is required" .Values.yandexAiStudio.folderId | quote }}
            - name: YANDEX_AI_STUDIO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "sein-zum-tode.secretName" . }}
                  key: {{ .Values.yandexAiStudio.apiKeySecretKey | quote }}
            - name: YANDEX_AI_STUDIO_ENABLE_SERVER_DATA_LOGGING
              value: {{ .Values.yandexAiStudio.enableServerDataLogging | quote }}
            {{- end }}
            {{- if or (eq .Values.deathPrediction.config.provider "openai") (eq .Values.notificationSchedule.config.provider "openai") }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "sein-zum-tode.secretName" . }}
                  key: {{ .Values.openai.apiKeySecretKey | quote }}
            - name: SOCKS5_PROXY_HOST
              value: {{ required "socks5Proxy.host is required" .Values.socks5Proxy.host | quote }}
            - name: SOCKS5_PROXY_PORT
              value: {{ required "socks5Proxy.port is required" .Values.socks5Proxy.port | quote }}
            - name: SOCKS5_PROXY_USERNAME
              value: {{ required "socks5Proxy.username is required" .Values.socks5Proxy.username | quote }}
            - name: SOCKS5_PROXY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sein-zum-tode.secretName" . }}
                  key: {{ .Values.socks5Proxy.passwordSecretKey | quote }}
            {{- end }}
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.temporal.address | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.temporal.namespace | quote }}
            - name: TEMPORAL_TASK_QUEUE
              value: {{ .Values.temporal.taskQueue | quote }}
            - name: TEMPORAL_TLS
              value: {{ .Values.temporal.tls | quote }}
            - name: TEMPORAL_ACTIVITY_RETRY_TIMEOUT_SECONDS
              value: {{ .Values.application.temporalActivityRetryTimeoutSeconds | quote }}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "sein-zum-tode.secretName" . }}
                  key: {{ .Values.application.telegramBotTokenSecretKey | quote }}
            - name: REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            - name: REDIS_DATABASE
              value: {{ .Values.redis.database | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sein-zum-tode.secretName" . }}
                  key: {{ .Values.redis.passwordSecretKey | quote }}
            - name: POSTGRES_HOST
              value: {{ .Values.postgres.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: POSTGRES_DATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sein-zum-tode.secretName" . }}
                  key: {{ .Values.postgres.passwordSecretKey | quote }}
            - name: POSTGRES_SSL
              value: {{ .Values.postgres.ssl | quote }}
            - name: POSTGRES_PGBOUNCER
              value: {{ .Values.postgres.pgbouncer | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: bot-content
              mountPath: /app/config/bot-content.yaml
              subPath: bot-content.yaml
              readOnly: true
            - name: bot-content
              mountPath: /app/config/death-prediction.yaml
              subPath: death-prediction.yaml
              readOnly: true
            - name: bot-content
              mountPath: /app/config/notification-schedule.yaml
              subPath: notification-schedule.yaml
              readOnly: true
      volumes:
        - name: bot-content
          configMap:
            name: {{ include "sein-zum-tode.fullname" . }}-bot-content
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
