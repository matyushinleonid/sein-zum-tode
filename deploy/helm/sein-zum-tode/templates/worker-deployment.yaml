apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sein-zum-tode.fullname" . }}-worker
  labels:
    {{- include "sein-zum-tode.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.workerReplicaCount }}
  selector:
    matchLabels:
      {{- include "sein-zum-tode.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        checksum/bot-content: {{ include (print $.Template.BasePath "/bot-content-configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "sein-zum-tode.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: telegram-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -m
            - sein_zum_tode.bot.worker
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: APP_NAME
              value: {{ printf "%s-worker" (include "sein-zum-tode.name" .) | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.application.logLevel | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.application.logFormat | quote }}
            - name: TELEGRAM_UPDATE_TTL_SECONDS
              value: {{ .Values.application.telegramUpdateTtlSeconds | quote }}
            - name: CONVERSATION_TTL_SECONDS
              value: {{ .Values.application.conversationTtlSeconds | quote }}
            - name: BOT_CONTENT_PATH
              value: /app/config/bot-content.yaml
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.temporal.address | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.temporal.namespace | quote }}
            - name: TEMPORAL_TASK_QUEUE
              value: {{ .Values.temporal.taskQueue | quote }}
            - name: TEMPORAL_TLS
              value: {{ .Values.temporal.tls | quote }}
            - name: TEMPORAL_ACTIVITY_RETRY_TIMEOUT_SECONDS
              value: {{ .Values.application.temporalActivityRetryTimeoutSeconds | quote }}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "sein-zum-tode.secretName" . }}
                  key: {{ .Values.application.telegramBotTokenSecretKey | quote }}
            - name: REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            - name: REDIS_DATABASE
              value: {{ .Values.redis.database | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sein-zum-tode.secretName" . }}
                  key: {{ .Values.redis.passwordSecretKey | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: bot-content
              mountPath: /app/config/bot-content.yaml
              subPath: bot-content.yaml
              readOnly: true
      volumes:
        - name: bot-content
          configMap:
            name: {{ include "sein-zum-tode.fullname" . }}-bot-content
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
