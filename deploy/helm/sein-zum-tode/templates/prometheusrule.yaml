{{- if and .Values.metrics.enabled .Values.metrics.prometheusRule.enabled (or .Values.metrics.prometheusRule.defaultRules .Values.metrics.prometheusRule.additionalRules) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "sein-zum-tode.fullname" . }}
  labels:
    {{- include "sein-zum-tode.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- if .Values.metrics.prometheusRule.defaultRules }}
    - name: sein-zum-tode.availability
      rules:
        - alert: SeinZumTodeIngressMetricsAbsent
          expr: absent(sein_zum_tode_application_info{namespace={{ .Release.Namespace | quote }},component="ingress"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Sein zum Tode ingress is not being scraped
        - alert: SeinZumTodeWorkerMetricsAbsent
          expr: absent(sein_zum_tode_application_info{namespace={{ .Release.Namespace | quote }},component="worker"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Sein zum Tode worker is not being scraped
        - alert: SeinZumTodeTelegramPollingStalled
          expr: time() - max(sein_zum_tode_telegram_poll_last_success_timestamp_seconds{namespace={{ .Release.Namespace | quote }}}) > {{ .Values.metrics.prometheusRule.thresholds.pollingStalledSeconds }}
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: Telegram polling has not succeeded for more than two minutes
        - alert: SeinZumTodeDependencyUnavailable
          expr: sein_zum_tode_dependency_up{namespace={{ .Release.Namespace | quote }}} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Sein zum Tode dependency is unavailable
    - name: sein-zum-tode.processing
      rules:
        - alert: SeinZumTodeHandoffFailures
          expr: increase(sein_zum_tode_telegram_updates_total{namespace={{ .Release.Namespace | quote }},stage="handoff",outcome="failed"}[10m]) > {{ .Values.metrics.prometheusRule.thresholds.handoffFailures }}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Telegram updates repeatedly fail to reach Temporal
        - alert: SeinZumTodePayloadCleanupFailure
          expr: increase(sein_zum_tode_payload_cleanups_total{namespace={{ .Release.Namespace | quote }},outcome="failed"}[15m]) > 0
          labels:
            severity: critical
          annotations:
            summary: Sensitive ephemeral payload cleanup failed
        - alert: SeinZumTodeTelegramPayloadExpired
          expr: increase(sein_zum_tode_payload_expired_total{namespace={{ .Release.Namespace | quote }},kind="telegram_update"}[15m]) > 0
          labels:
            severity: warning
          annotations:
            summary: A Telegram update expired before it could be processed
        - alert: SeinZumTodeTelegramDeliveryFailureRate
          expr: sum(increase(sein_zum_tode_telegram_deliveries_total{namespace={{ .Release.Namespace | quote }},outcome="failed",error_kind!="recipient_unavailable"}[15m])) / clamp_min(sum(increase(sein_zum_tode_telegram_deliveries_total{namespace={{ .Release.Namespace | quote }}}[15m])), 1) > {{ .Values.metrics.prometheusRule.thresholds.telegramDeliveryFailureRate }} and sum(increase(sein_zum_tode_telegram_deliveries_total{namespace={{ .Release.Namespace | quote }}}[15m])) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Telegram delivery failure rate exceeds its configured threshold
        - alert: SeinZumTodeLlmFailureRate
          expr: sum(increase(sein_zum_tode_llm_requests_total{namespace={{ .Release.Namespace | quote }},outcome="failed"}[30m])) / clamp_min(sum(increase(sein_zum_tode_llm_requests_total{namespace={{ .Release.Namespace | quote }}}[30m])), 1) > {{ .Values.metrics.prometheusRule.thresholds.llmFailureRate }} and sum(increase(sein_zum_tode_llm_requests_total{namespace={{ .Release.Namespace | quote }}}[30m])) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: LLM failure rate exceeds its configured threshold
        - alert: SeinZumTodeLlmProviderFallback
          expr: increase(sein_zum_tode_llm_fallbacks_total{namespace={{ .Release.Namespace | quote }}}[15m]) > {{ .Values.metrics.prometheusRule.thresholds.llmFallbacks }}
          labels:
            severity: warning
          annotations:
            summary: The primary LLM provider failed and requests fell back to the secondary provider
    {{- end }}
    {{- with .Values.metrics.prometheusRule.additionalRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
