apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sein-zum-tode.fullname" . }}-bot-content
  labels:
    {{- include "sein-zum-tode.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
data:
  bot-content.yaml: |
    {{- toYaml .Values.botContent | nindent 4 }}
  death-prediction.yaml: |
    {{- toYaml .Values.deathPrediction.config | nindent 4 }}
  notification-schedule.yaml: |
    {{- toYaml .Values.notificationSchedule.config | nindent 4 }}
