{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "sein-zum-tode.fullname" . }}
  labels:
    {{- include "sein-zum-tode.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ required "externalSecret.secretStoreRef.name is required" .Values.externalSecret.secretStoreRef.name | quote }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind | quote }}
  target:
    name: {{ include "sein-zum-tode.externalSecretName" . }}
    creationPolicy: {{ .Values.externalSecret.creationPolicy }}
    deletionPolicy: {{ .Values.externalSecret.deletionPolicy }}
  data:
    {{- required "externalSecret.data must contain at least one mapping" .Values.externalSecret.data | toYaml | nindent 4 }}
{{- end }}
