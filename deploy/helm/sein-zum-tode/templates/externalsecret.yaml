{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "sein-zum-tode.fullname" . }}
  labels:
    {{- include "sein-zum-tode.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name | quote }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind | quote }}
  target:
    name: {{ include "sein-zum-tode.secretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: {{ .Values.postgres.passwordSecretKey | quote }}
      remoteRef:
        key: {{ required "externalSecret.remoteKey is required" .Values.externalSecret.remoteKey | quote }}
        property: {{ required "externalSecret.properties.postgresPassword is required" .Values.externalSecret.properties.postgresPassword | quote }}
    - secretKey: {{ .Values.redis.passwordSecretKey | quote }}
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey | quote }}
        property: {{ required "externalSecret.properties.redisPassword is required" .Values.externalSecret.properties.redisPassword | quote }}
    - secretKey: {{ .Values.application.telegramBotTokenSecretKey | quote }}
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey | quote }}
        property: {{ required "externalSecret.properties.telegramBotToken is required" .Values.externalSecret.properties.telegramBotToken | quote }}
    {{- if eq .Values.deathPrediction.config.provider "yandex" }}
    - secretKey: {{ .Values.yandexAiStudio.apiKeySecretKey | quote }}
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey | quote }}
        property: {{ required "externalSecret.properties.yandexAiStudioApiKey is required" .Values.externalSecret.properties.yandexAiStudioApiKey | quote }}
    {{- end }}
    {{- if eq .Values.deathPrediction.config.provider "openai" }}
    - secretKey: {{ .Values.openai.apiKeySecretKey | quote }}
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey | quote }}
        property: {{ required "externalSecret.properties.openaiApiKey is required" .Values.externalSecret.properties.openaiApiKey | quote }}
    - secretKey: {{ .Values.socks5Proxy.passwordSecretKey | quote }}
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey | quote }}
        property: {{ required "externalSecret.properties.socks5ProxyPassword is required" .Values.externalSecret.properties.socks5ProxyPassword | quote }}
    {{- end }}
{{- end }}
