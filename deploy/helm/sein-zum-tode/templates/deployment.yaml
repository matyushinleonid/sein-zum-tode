apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sein-zum-tode.ingressFullname" . }}
  labels:
    {{- include "sein-zum-tode.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress
  {{- with (merge .Values.ingress.annotations .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.ingress.replicaCount }}
  strategy:
    {{- toYaml .Values.ingress.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "sein-zum-tode.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ingress
  template:
    metadata:
      {{- with .Values.ingress.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.ingress.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "sein-zum-tode.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ingress
    spec:
      serviceAccountName: {{ include "sein-zum-tode.ingressServiceAccountName" . }}
      automountServiceAccountToken: {{ .Values.ingress.coordination.enabled }}
      terminationGracePeriodSeconds: {{ .Values.ingress.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: telegram-ingress
          image: {{ include "sein-zum-tode.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: health
              containerPort: {{ .Values.health.port }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            {{- toYaml .Values.ingress.readinessProbe | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            {{- toYaml .Values.ingress.livenessProbe | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health/startup
              port: health
            {{- toYaml .Values.ingress.startupProbe | nindent 12 }}
          env:
            - name: APP_NAME
              value: {{ include "sein-zum-tode.name" . | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.application.logLevel | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.application.logFormat | quote }}
            - name: METRICS_HOST
              value: {{ .Values.metrics.host | quote }}
            - name: METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            - name: HEALTH_HOST
              value: {{ .Values.health.host | quote }}
            - name: HEALTH_PORT
              value: {{ .Values.health.port | quote }}
            - name: HEALTH_CHECK_INTERVAL_SECONDS
              value: {{ .Values.health.checkIntervalSeconds | quote }}
            - name: HEALTH_CHECK_TIMEOUT_SECONDS
              value: {{ .Values.health.checkTimeoutSeconds | quote }}
            - name: HEALTH_LIVENESS_TIMEOUT_SECONDS
              value: {{ .Values.health.livenessTimeoutSeconds | quote }}
            - name: HEALTH_SUCCESS_THRESHOLD
              value: {{ .Values.health.successThreshold | quote }}
            - name: HEALTH_FAILURE_THRESHOLD
              value: {{ .Values.health.failureThreshold | quote }}
            - name: TELEGRAM_ALLOWED_USER_IDS
              value: {{ .Values.application.telegramAllowedUserIds | toJson | quote }}
            - name: TELEGRAM_POLLING_TIMEOUT_SECONDS
              value: {{ .Values.application.telegramPollingTimeoutSeconds | quote }}
            - name: TELEGRAM_REQUEST_TIMEOUT_SECONDS
              value: {{ .Values.application.telegramRequestTimeoutSeconds | quote }}
            - name: TELEGRAM_SOCKS5_PROXY_ENABLED
              value: {{ .Values.telegram.socks5Proxy.enabled | quote }}
            {{- if .Values.telegram.socks5Proxy.enabled }}
            - name: SOCKS5_PROXY_HOST
              value: {{ required "socks5Proxy.host is required" .Values.socks5Proxy.host | quote }}
            - name: SOCKS5_PROXY_PORT
              value: {{ required "socks5Proxy.port is required" .Values.socks5Proxy.port | quote }}
            - name: SOCKS5_PROXY_USERNAME
              value: {{ required "socks5Proxy.username is required" .Values.socks5Proxy.username | quote }}
            - name: SOCKS5_PROXY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sein-zum-tode.secretRefName" (list . .Values.socks5Proxy.passwordSecretRef) }}
                  key: {{ .Values.socks5Proxy.passwordSecretRef.key | quote }}
            {{- end }}
            - name: TELEGRAM_POLL_COORDINATION_MODE
              value: {{ ternary "kubernetes" "none" .Values.ingress.coordination.enabled | quote }}
            {{- if .Values.ingress.coordination.enabled }}
            - name: TELEGRAM_POLL_LEASE_NAME
              value: {{ include "sein-zum-tode.pollingLeaseName" . | quote }}
            - name: TELEGRAM_POLL_LEASE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TELEGRAM_POLL_LEASE_HOLDER_IDENTITY
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TELEGRAM_POLL_LEASE_DURATION_SECONDS
              value: {{ .Values.ingress.coordination.leaseDurationSeconds | quote }}
            - name: TELEGRAM_POLL_LEASE_RETRY_INTERVAL_SECONDS
              value: {{ .Values.ingress.coordination.retryIntervalSeconds | quote }}
            - name: TELEGRAM_POLL_LEASE_HANDOFF_DELAY_SECONDS
              value: {{ .Values.ingress.coordination.handoffDelaySeconds | quote }}
            - name: KUBERNETES_API_REQUEST_TIMEOUT_SECONDS
              value: {{ .Values.ingress.coordination.apiRequestTimeoutSeconds | quote }}
            {{- end }}
            - name: TELEGRAM_UPDATE_TTL_SECONDS
              value: {{ .Values.application.telegramUpdateTtlSeconds | quote }}
            - name: QUESTIONNAIRE_TTL_SECONDS
              value: {{ .Values.application.questionnaireTtlSeconds | quote }}
            - name: RETRY_INITIAL_DELAY_SECONDS
              value: {{ .Values.application.retryInitialDelaySeconds | quote }}
            - name: RETRY_MAX_DELAY_SECONDS
              value: {{ .Values.application.retryMaxDelaySeconds | quote }}
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.temporal.address | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.temporal.namespace | quote }}
            - name: TEMPORAL_TASK_QUEUE
              value: {{ .Values.temporal.taskQueue | quote }}
            - name: TEMPORAL_TLS
              value: {{ .Values.temporal.tls.enabled | quote }}
            {{- with .Values.temporal.tls.serverName }}
            - name: TEMPORAL_TLS_SERVER_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.temporal.tls.secretRef.caKey }}
            - name: TEMPORAL_TLS_CA_FILE
              value: /app/tls/temporal/ca.crt
            {{- end }}
            {{- with .Values.temporal.tls.secretRef.certificateKey }}
            - name: TEMPORAL_TLS_CERTIFICATE_FILE
              value: /app/tls/temporal/tls.crt
            {{- end }}
            {{- with .Values.temporal.tls.secretRef.privateKeyKey }}
            - name: TEMPORAL_TLS_PRIVATE_KEY_FILE
              value: /app/tls/temporal/tls.key
            {{- end }}
            - name: TEMPORAL_ACTIVITY_RETRY_TIMEOUT_SECONDS
              value: {{ .Values.application.temporalActivityRetryTimeoutSeconds | quote }}
            - name: BROADCAST_RECIPIENT_PAGE_SIZE
              value: {{ .Values.application.broadcastRecipientPageSize | quote }}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "sein-zum-tode.secretRefName" (list . .Values.telegram.tokenSecretRef) }}
                  key: {{ .Values.telegram.tokenSecretRef.key | quote }}
            - name: REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            - name: REDIS_DATABASE
              value: {{ .Values.redis.database | quote }}
            {{- with .Values.redis.username }}
            - name: REDIS_USERNAME
              value: {{ . | quote }}
            {{- end }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sein-zum-tode.secretRefName" (list . .Values.redis.passwordSecretRef) }}
                  key: {{ .Values.redis.passwordSecretRef.key | quote }}
            - name: REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS
              value: {{ .Values.redis.connection.socketConnectTimeoutSeconds | quote }}
            - name: REDIS_SOCKET_TIMEOUT_SECONDS
              value: {{ .Values.redis.connection.socketTimeoutSeconds | quote }}
            {{- if ne .Values.redis.connection.maxConnections nil }}
            - name: REDIS_MAX_CONNECTIONS
              value: {{ .Values.redis.connection.maxConnections | quote }}
            {{- end }}
            - name: REDIS_HEALTH_CHECK_INTERVAL_SECONDS
              value: {{ .Values.redis.connection.healthCheckIntervalSeconds | quote }}
            - name: REDIS_TLS
              value: {{ .Values.redis.tls.enabled | quote }}
            - name: REDIS_TLS_VERIFY
              value: {{ .Values.redis.tls.verify | quote }}
            {{- with .Values.redis.tls.secretRef.caKey }}
            - name: REDIS_TLS_CA_FILE
              value: /app/tls/redis/ca.crt
            {{- end }}
            {{- with .Values.redis.tls.secretRef.certificateKey }}
            - name: REDIS_TLS_CERTIFICATE_FILE
              value: /app/tls/redis/tls.crt
            {{- end }}
            {{- with .Values.redis.tls.secretRef.privateKeyKey }}
            - name: REDIS_TLS_PRIVATE_KEY_FILE
              value: /app/tls/redis/tls.key
            {{- end }}
            {{- with .Values.ingress.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.ingress.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.ingress.resources | nindent 12 }}
          {{- if or (include "sein-zum-tode.redisTlsMaterial" .) (include "sein-zum-tode.temporalTlsMaterial" .) .Values.ingress.extraVolumeMounts }}
          volumeMounts:
            {{- if include "sein-zum-tode.redisTlsMaterial" . }}
            - name: redis-tls
              mountPath: /app/tls/redis
              readOnly: true
            {{- end }}
            {{- if include "sein-zum-tode.temporalTlsMaterial" . }}
            - name: temporal-tls
              mountPath: /app/tls/temporal
              readOnly: true
            {{- end }}
            {{- with .Values.ingress.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or (include "sein-zum-tode.redisTlsMaterial" .) (include "sein-zum-tode.temporalTlsMaterial" .) .Values.ingress.extraVolumes }}
      volumes:
        {{- if include "sein-zum-tode.redisTlsMaterial" . }}
        - name: redis-tls
          secret:
            secretName: {{ include "sein-zum-tode.secretRefName" (list . .Values.redis.tls.secretRef) }}
            items:
              {{- with .Values.redis.tls.secretRef.caKey }}
              - key: {{ . | quote }}
                path: ca.crt
              {{- end }}
              {{- with .Values.redis.tls.secretRef.certificateKey }}
              - key: {{ . | quote }}
                path: tls.crt
              {{- end }}
              {{- with .Values.redis.tls.secretRef.privateKeyKey }}
              - key: {{ . | quote }}
                path: tls.key
              {{- end }}
        {{- end }}
        {{- if include "sein-zum-tode.temporalTlsMaterial" . }}
        - name: temporal-tls
          secret:
            secretName: {{ include "sein-zum-tode.secretRefName" (list . .Values.temporal.tls.secretRef) }}
            items:
              {{- with .Values.temporal.tls.secretRef.caKey }}
              - key: {{ . | quote }}
                path: ca.crt
              {{- end }}
              {{- with .Values.temporal.tls.secretRef.certificateKey }}
              - key: {{ . | quote }}
                path: tls.crt
              {{- end }}
              {{- with .Values.temporal.tls.secretRef.privateKeyKey }}
              - key: {{ . | quote }}
                path: tls.key
              {{- end }}
        {{- end }}
        {{- with .Values.ingress.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.ingress.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ingress.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ingress.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ingress.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
