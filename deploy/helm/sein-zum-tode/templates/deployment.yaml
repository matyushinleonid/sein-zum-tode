apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sein-zum-tode.fullname" . }}
  labels:
    {{- include "sein-zum-tode.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "sein-zum-tode.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ingress
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        {{- include "sein-zum-tode.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ingress
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: telegram-ingress
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
          startupProbe:
            httpGet:
              path: /metrics
              port: metrics
            failureThreshold: 30
            periodSeconds: 2
          {{- end }}
          env:
            - name: APP_NAME
              value: {{ include "sein-zum-tode.name" . | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.application.logLevel | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.application.logFormat | quote }}
            - name: METRICS_HOST
              value: {{ .Values.metrics.host | quote }}
            - name: METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            - name: TELEGRAM_POLLING_TIMEOUT_SECONDS
              value: {{ .Values.application.telegramPollingTimeoutSeconds | quote }}
            - name: TELEGRAM_REQUEST_TIMEOUT_SECONDS
              value: {{ .Values.application.telegramRequestTimeoutSeconds | quote }}
            - name: TELEGRAM_UPDATE_TTL_SECONDS
              value: {{ .Values.application.telegramUpdateTtlSeconds | quote }}
            - name: QUESTIONNAIRE_TTL_SECONDS
              value: {{ .Values.application.questionnaireTtlSeconds | quote }}
            - name: RETRY_INITIAL_DELAY_SECONDS
              value: {{ .Values.application.retryInitialDelaySeconds | quote }}
            - name: RETRY_MAX_DELAY_SECONDS
              value: {{ .Values.application.retryMaxDelaySeconds | quote }}
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.temporal.address | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.temporal.namespace | quote }}
            - name: TEMPORAL_TASK_QUEUE
              value: {{ .Values.temporal.taskQueue | quote }}
            - name: TEMPORAL_TLS
              value: {{ .Values.temporal.tls | quote }}
            - name: TEMPORAL_ACTIVITY_RETRY_TIMEOUT_SECONDS
              value: {{ .Values.application.temporalActivityRetryTimeoutSeconds | quote }}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "sein-zum-tode.secretName" . }}
                  key: {{ .Values.application.telegramBotTokenSecretKey | quote }}
            - name: REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            - name: REDIS_DATABASE
              value: {{ .Values.redis.database | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sein-zum-tode.secretName" . }}
                  key: {{ .Values.redis.passwordSecretKey | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
