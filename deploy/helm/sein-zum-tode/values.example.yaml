# Copy this file, replace all placeholders, and reference the resulting values
# from the Argo CD Application.
replicaCount: 1
workerReplicaCount: 1

metrics:
  enabled: true
  host: 0.0.0.0
  port: 8000
  serviceMonitor:
    enabled: true
    interval: 30s
    additionalLabels:
      release: kube-prometheus-stack
  prometheusRule:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack

health:
  host: 0.0.0.0
  port: 8001
  checkIntervalSeconds: 10
  checkTimeoutSeconds: 3
  livenessTimeoutSeconds: 30
  successThreshold: 1
  failureThreshold: 2

image:
  repository: cr.yandex/crp00000000000000000/sein-zum-tode
  tag: latest

postgres:
  host: postgres.local
  port: 6432
  database: sein_zum_tode
  user: sein_zum_tode
  ssl: false
  pgbouncer: true

temporal:
  address: temporal.local:7233
  namespace: default
  taskQueue: sein-zum-tode
  tls: false

application:
  logFormat: json
  temporalActivityRetryTimeoutSeconds: 300
  broadcastRecipientPageSize: 100
  questionnaireTtlSeconds: 3600
  unsupportedUpdateSessionTtlSeconds: 3600
  telegramAdminUserIds: []

botContent:
