        custom_timezone: Timezone
        custom_next_notifications: "Next notifications:"
        custom_disabled: Notifications are disabled.
        custom_description_unavailable: Description unavailable.
        custom_next_notifications_unavailable: Next notification times unavailable.
        custom_unchanged: The schedule was not changed.
        custom_change_hint: If this is not what you meant, use /notifications to configure it again.
        updated: "Notifications: {frequency}"
      llm:
        limit_exhausted: Your LLM request limit is exhausted.
      prediction:
        failed: Something went wrong. Please try again later.
        mock: "Mock prediction: {answers}"
      questionnaire:
        privacy_notice: |-
          Before we begin, a note about privacy.

          Your answers are kept temporarily only while the questionnaire is active. After processing, they are deleted immediately. If the questionnaire is abandoned, the data is deleted automatically when its retention period expires. The answers are not stored in the bot's primary database.

          The bot is open source. Use /about to view the source code and learn more about the project.
        started: Your questionnaire has started.
        completed: Thank you for your answers!
        deleted: Your answers were deleted from our system for privacy reasons.
        cleanup_failed: Immediate deletion could not be confirmed. Your temporary questionnaire data will be deleted automatically when its retention period expires.
        questions:
          - id: birth_date
            text: "Your date of birth. A full date (DD.MM.YYYY) gives the model the most reliable basis for its estimate."
          - id: sex
            text: "Your sex:"
          - id: height_cm
            text: "Your current height in centimeters:"
          - id: weight_kg
            text: "Your current weight in kilograms:"
          - id: location
            text: "Which country and city do you live in?"
          - id: fruit_and_vegetables
            text: "How often do you eat fresh vegetables and fruit? (several times a day / daily / several times a week / rarely / never):"
          - id: sweets
            text: "How often do you consume sweets, baked goods, or sugary drinks? (daily / several times a week / rarely / never):"
          - id: processed_meat
            text: "How often do you eat processed or fried meat (sausage, hot dogs, fried chicken, bacon)? (daily / several times a week / rarely / never):"
          - id: fast_food
            text: "How often do you eat fast food or highly processed food? (daily / several times a week / rarely / never):"
          - id: physical_activity
            text: "How often do you engage in moderate or vigorous physical activity (brisk walking, cycling, swimming, running, weightlifting, team sports, etc.)? Please specify the activity and frequency (for example: cycling, twice a week for 30 minutes):"
          - id: smoking
            text: "Do you smoke? Please specify the substance and frequency (for example: tobacco, one pack a day / previously smoked tobacco, quit three years ago):"
          - id: alcohol_and_substances
            text: "Do you consume alcoholic beverages or other psychoactive substances? Please specify the frequency and amount (for example: wine, two glasses a week / beer, three bottles daily):"
          - id: chronic_conditions
            text: "Do you have any chronic conditions diagnosed by a doctor? If so, list them briefly:"
          - id: family_medical_history
            text: "Have any of your close relatives (parents, grandparents, or siblings) had serious illnesses such as diabetes, cancer, or cardiovascular disease? Briefly specify the illness and the relative:"
          - id: family_longevity
            text: "Have there been cases of longevity in your family, with relatives living beyond the age of 90? Please specify the relative and their age:"
          - id: stress_sources
            text: "How would you describe the main sources of stress in your life? Select all that apply and add details if you wish: work / education / family relationships / finances / health / other:"
          - id: depression
            text: "Have you felt persistently low or depressed for an extended period, from several weeks or longer? Please specify how often this occurs and approximately how long these periods last (for example: once a year for several weeks):"
          - id: sleep
            text: "How would you rate the quality of your sleep? Please specify your average sleep duration per night and whether you often have difficulty falling asleep or wake up during the night:"
          - id: occupation
            text: "What kind of work do you mainly do? (mostly physical / mostly office-based or intellectual / a mix of physical and intellectual / not currently working):"
    ru:
      help: |-
        Сама по себе тема смерти сегодня в обществе табуирована (например, так считает Ф. Арьес). Данный проект предназначен для того, чтобы помочь пользователю пережить перспективу смерти как явления, которое произойдёт и, более того, уже происходит непосредственно с ним. Пользователю предлагается ответить на ряд вопросов о своём образе жизни, после чего будет осуществлена примерная оценка оставшейся её продолжительности средствами LLM. Разумеется, сам по себе результат вычисления оставшихся дней не претендует на какую-то особую точность. Основную ценность представляет ежедневно уменьшающееся число оставшихся дней, которое бот будет регулярно присылать пользователю.

        Нажмите /begin, чтобы начать заполнение анкеты. Будет задано около 20 вопросов; ответы на них не хранятся на наших серверах персистентно из соображений приватности. Если вы не хотите отвечать на какой-то вопрос, отправьте дефис (-). Для управления частотой оповещений нажмите /notifications, а для изменения языка — /localization. Для скорейшего достижения эффекта рекомендуем оставить ежедневные уведомления.
      about: 'Sein zum Tode за авторством Леонида Матюшина. <a href="https://github.com/matyushinleonid/sein-zum-tode">Project repository</a> · <a href="https://github.com/matyushinleonid/k8s.leonid.sh">IaC repository</a> · <a href="https://github.com/matyushinleonid/k8s.leonid.sh/tree/main/argocd/sein-zum-tode">Argo CD application</a>'
