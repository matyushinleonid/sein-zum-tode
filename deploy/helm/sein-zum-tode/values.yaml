            text: "Курите ли вы? Уточните тип вещества и частоту (например: табак, 1 пачка в день / раньше курил табак, бросил 3 года назад):"
          - id: alcohol_and_substances
            text: "Употребляете ли вы алкогольные напитки или иные психоактивные вещества? Уточните частоту и количество (например: вино, 2 бокала в неделю / пиво, 3 бутылки ежедневно):"
          - id: chronic_conditions
            text: "Есть ли у вас хронические заболевания, диагностированные врачом? Перечислите кратко, если есть:"
          - id: family_medical_history
            text: "Были ли у ваших ближайших родственников (родители, бабушки и дедушки, братья и сёстры) серьёзные заболевания, например диабет, онкология или сердечно-сосудистые заболевания? Уточните кратко заболевание и родственника:"
          - id: family_longevity
            text: "Были ли в вашей семье случаи долголетия — родственники, жившие дольше 90 лет? Уточните родственника и возраст:"
          - id: stress_sources
            text: "Как бы вы описали основные источники стресса в вашей жизни? Выберите все подходящие варианты и уточните по желанию: работа / учёба / семейные отношения / финансы / здоровье / другие:"
          - id: depression
            text: "Чувствуете ли вы себя подавленным или депрессивным на протяжении длительного времени, от нескольких недель и более? Уточните частоту и примерную продолжительность таких периодов (например: раз в год по несколько недель):"
          - id: sleep
            text: "Как вы оцениваете качество своего сна? Уточните продолжительность сна в среднем за ночь и укажите, часто ли испытываете проблемы с засыпанием или пробуждением ночью:"
          - id: occupation
            text: "Какую работу вы выполняете в основном? (преимущественно физическая / преимущественно офисная или интеллектуальная / смешанная физическая и интеллектуальная / не работаю):"

