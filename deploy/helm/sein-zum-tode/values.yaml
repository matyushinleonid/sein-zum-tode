replicaCount: 1
workerReplicaCount: 1

image:
  repository: cr.yandex/replace-with-registry-id/sein-zum-tode
  pullPolicy: IfNotPresent
  tag: latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

application:
  logLevel: INFO
  logFormat: json
  telegramPollingTimeoutSeconds: 30
  telegramRequestTimeoutSeconds: 40
  telegramUpdateTtlSeconds: 3600
  questionnaireTtlSeconds: 3600
  retryInitialDelaySeconds: 1
  retryMaxDelaySeconds: 30
  temporalActivityRetryTimeoutSeconds: 300
  telegramBotTokenSecretKey: TELEGRAM_BOT_TOKEN
  telegramAdminUserIds:
    - 162573173

botContent:
  version: production-v2
  default_locale: en
  locales:
    en:
      help: Mock help response. Use /localization to change language.
      about: 'About this bot: <a href="https://github.com/matyushinleonid/sein-zum-tode">github</a>'
      unsupported: Use /help to learn how to use the bot
      group_unsupported: Group chats are not supported. Please message me directly.
      scream_denied: You can't scream 🤷‍♂️
      notification: "mock notification: {days_left}"
      localization:
        prompt: Choose your language / Выберите язык
        russian: "🇷🇺 RU"
        english: "🇺🇸 EN"
        updated: Language changed to English.
      notification_settings:
        prompt: How often should notifications be sent?
        daily: Daily
        weekly: Weekly
        monthly: Monthly
        never: Never
        updated: "Notifications: {frequency}"
      prediction:
        limit_exhausted: Your prediction request limit is exhausted.
        failed: Something went wrong. Please try again later.
        mock: "Mock prediction: {answers}"
      questionnaire:
        started: mock conversation started
        completed: thanks for your answers!
        deleted: your answers were deleted from our system
        questions:
          - id: q1
            text: q1?
          - id: q2
            text: q2?
    ru:
      help: Тестовая справка. Используйте /localization, чтобы изменить язык.
      about: 'О боте: <a href="https://github.com/matyushinleonid/sein-zum-tode">github</a>'
      unsupported: Нажмите /help, чтобы узнать, как пользоваться ботом
      group_unsupported: Групповые чаты не поддерживаются. Напишите боту напрямую.
      scream_denied: Ты не можешь кричать 🤷‍♂️
      notification: "Тестовое уведомление: осталось дней — {days_left}"
      localization:
        prompt: Выберите язык.
        russian: "🇷🇺 RU"
        english: "🇺🇸 EN"
        updated: Язык изменён на русский.
      notification_settings:
        prompt: Как часто присылать уведомления?
        daily: Ежедневно
        weekly: Еженедельно
        monthly: Ежемесячно
        never: Никогда
        updated: "Уведомления: {frequency}"
      prediction:
        limit_exhausted: Лимит запросов на предсказание исчерпан.
        failed: Что-то пошло не так. Попробуйте ещё раз позднее.
        mock: "Тестовое предсказание: {answers}"
      questionnaire:
        started: Тестовая анкета начата.
        completed: Спасибо за ваши ответы!
        deleted: Ваши ответы удалены из нашей системы.
        questions:
          - id: q1
            text: Ваш возраст и пол?
          - id: q2
            text: Кем вы работаете, где живёте? Есть ли у вас спорт или увлечения?

yandexAiStudio:
  folderId: ""
  apiKeySecretKey: YANDEX_AI_STUDIO_API_KEY
  enableServerDataLogging: false

openai:
  apiKeySecretKey: OPENAI_API_KEY

socks5Proxy:
  host: 167.233.46.190
  port: 32768
  username: matyushinleonid
  passwordSecretKey: SOCKS5_PROXY_PASSWORD

deathPrediction:
  config:
    provider: mock
    system_prompt: |
      Do not use the pronoun "I" in your responses. If absolutely necessary, you may use "we", but passive-voice or impersonal constructions are preferable. Respond in the same language the user used in their questionnaire answers.

      First assess the questionnaire as a whole. If the answers are predominantly meaningless, random, irrelevant to the questions, or contain too little usable information for a responsible estimate, set "prediction_possible" to false, set "days_left" to null, and use "message" to explain briefly what is wrong and ask the user to complete the questionnaire with meaningful answers. Do not reject a questionnaire merely because one answer is missing, uncertain, or uninformative. When "prediction_possible" is false, do not provide a lifespan estimate.

      Otherwise set "prediction_possible" to true, estimate how many days the user has left to live in the "days_left" field, and provide a brief explanation in the "message" field. Do not show explicit arithmetic; outline in general terms how the answers influence the result. Aim for as much accuracy as possible, avoid overly optimistic estimates, and avoid round numbers such as exactly 365 or 10. Convert the number of remaining days to years and present it at the end of the explanation.
    mock:
      days_left: 26837
    yandex:
      model: aliceai-llm
      model_version: latest
      temperature: 0.3
      max_tokens: 1000
      request_timeout_seconds: 180
    openai:
      model: gpt-5.6-sol
      reasoning_effort: medium
      max_output_tokens: 1000
      request_timeout_seconds: 180

postgres:
  host: postgres.local
  port: 6432
  database: sein_zum_tode
  user: sein_zum_tode
  passwordSecretKey: POSTGRES_PASSWORD
  ssl: false
  pgbouncer: true

temporal:
  address: temporal.local:7233
  namespace: default
  taskQueue: sein-zum-tode
  tls: false

redis:
  host: redis.local
  port: 6379
  passwordSecretKey: REDIS_PASSWORD
  database: 0

# If enabled, selected properties from one Lockbox secret are mapped into a
# Kubernetes Secret. Source property names are configured under `properties`.
externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: yandex-lockbox
    kind: ClusterSecretStore
  remoteKey: replace-with-lockbox-secret-id
  targetName: ""
  properties:
    postgresPassword: POSTGRES_PASSWORD
    redisPassword: REDIS_PASSWORD
    telegramBotToken: TELEGRAM_BOT_TOKEN
    yandexAiStudioApiKey: YANDEX_AI_STUDIO_API_KEY
    openaiApiKey: OPENAI_API_KEY
    socks5ProxyPassword: SOCKS5_PROXY_PASSWORD

# Used only when externalSecret.enabled=false. The existing Secret must contain
# the configured database, Redis, Telegram, and optional Yandex keys.
existingSecret: ""

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
