replicaCount: 1
workerReplicaCount: 1

image:
  repository: cr.yandex/replace-with-registry-id/sein-zum-tode
  pullPolicy: IfNotPresent
  tag: latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

metrics:
  enabled: true
  host: 0.0.0.0
  port: 8000
  serviceMonitor:
    enabled: true
    interval: 30s
    additionalLabels:
      release: kube-prometheus-stack
  prometheusRule:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

application:
  logLevel: INFO
  logFormat: json
  telegramPollingTimeoutSeconds: 30
  telegramRequestTimeoutSeconds: 40
  telegramUpdateTtlSeconds: 3600
  unsupportedUpdateSessionTtlSeconds: 3600
  questionnaireTtlSeconds: 3600
  retryInitialDelaySeconds: 1
  retryMaxDelaySeconds: 30
  temporalActivityRetryTimeoutSeconds: 300
  telegramBotTokenSecretKey: TELEGRAM_BOT_TOKEN
  telegramAdminUserIds:
    - 162573173

