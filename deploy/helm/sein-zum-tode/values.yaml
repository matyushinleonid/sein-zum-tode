  temporalActivityRetryTimeoutSeconds: 300
  broadcastRecipientPageSize: 100
  telegramAllowedUserIds: []
  telegramAdminUserIds: []
  telegramKeyboardMode: reply

applicationConfig:
  create: true
  existingConfigMap: ""

