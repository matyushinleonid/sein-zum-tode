  locales:
    en:
      help: |-
        The subject of death itself is taboo in contemporary society (as argued, for example, by Philippe Ariès). This project is intended to help users confront the prospect of death as something that will happen and, moreover, is already happening to them. Users are invited to answer a series of questions about their lifestyle, after which an LLM will provide an approximate estimate of their remaining lifespan. Naturally, the calculated number of days remaining does not claim any particular degree of accuracy. The principal value lies in the number of remaining days decreasing each day, which the bot will send to the user regularly.

        Press /begin to start the questionnaire. You will be asked approximately 20 questions. For privacy reasons, your answers are not stored persistently on our servers. If you do not want to answer a question, send a dash (-). Use /notifications to manage notification frequency and /localization to change language. For the strongest effect, we recommend keeping daily notifications.
      about: 'Sein zum Tode by Leonid Matyushin. <a href="https://github.com/matyushinleonid/sein-zum-tode">Project repository</a> · <a href="https://github.com/matyushinleonid/k8s.leonid.sh">IaC repository</a> · <a href="https://github.com/matyushinleonid/k8s.leonid.sh/tree/main/argocd/sein-zum-tode">Argo CD application</a>'
      text_unsupported: Use /help to learn how to use the bot.
      payload_expired: This message expired before it could be processed. Please send it again.
      group_unsupported: Group chats are not supported. Please message me directly.
      scream_denied: You can't scream 🤷‍♂️
      notification:
        default:
          other: "Days left: {days_left}"
        natural:
          one: "{days_left} day remains"
          other: "{days_left} days remain"
        epic:
          - id: haunting
            text:
              one: "There is {days_left} day left. It gets harder to ignore with each passing day"
              other: "There are {days_left} days left. It gets harder to ignore with each passing day"
          - id: witch_house
            style: witch_house
            text:
              one: "{days_left} day remains"
              other: "{days_left} days remain"
          - id: words
            number_style: words
            text:
              one: "{days_left} day remains"
              other: "{days_left} days remain"
          - id: witch_house_words
            style: witch_house
            number_style: words
            text:
              one: "{days_left} day remains"
              other: "{days_left} days remain"
        mythic:
          - id: stupa
            media:
              kind: audio
              url: https://storage.yandexcloud.net/leonid.sh/sein-zum-tode/stupa.mp3
      localization:
        prompt: Choose your language / Выберите язык
        russian: "🇷🇺 RU"
        english: "🇺🇸 EN"
        updated: Language changed to English.
      notification_settings:
        prompt: "Choose a preset or create your own schedule. Current timezone: {timezone}."
        daily: Daily
        weekly: Weekly
        monthly: Monthly
        never: Never
        custom: "✨ Custom schedule"
        custom_prompt: 'Describe when notifications should be sent, including your timezone when relevant. For example: "weekdays at 19:30 Berlin time".'
        custom_mock: Your custom notification schedule has been updated.
        custom_invalid: The proposed schedule could not be applied. Please describe it differently and try again.
        custom_too_frequent: Your desire to remain so close to your own death is commendable, but notifications cannot be sent more than once a day.
        custom_failed: Something went wrong while configuring notifications. Please try again later.
        custom_interpretation: "The model interpreted your request as:"
        custom_schedule: "Applied schedule:"
        custom_cron: Cron
