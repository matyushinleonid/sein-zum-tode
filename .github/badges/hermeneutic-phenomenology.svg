<?xml version="1.0" encoding="UTF-8"?>
<svg width="111px" height="25px" viewBox="0 0 111 25" version="1.1"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-label="Hermeneutic phenomenology">
  <title>Hermeneutic phenomenology</title>

  <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
    <!-- Main section -->
    <rect x="0" y="0" width="86" height="25" fill="#2E7D32"/>

    <!-- Check section -->
    <rect x="86" y="0" width="25" height="25" fill="#000000"/>

    <!-- Subtle text shadow -->
    <text font-family="Verdana-Bold, Verdana, sans-serif"
          font-size="8"
          font-weight="700"
          fill="#000000"
          opacity="0.35">
      <tspan x="4.1" y="10.1">hermeneutic</tspan>
      <tspan x="4.1" y="20.1">phenomenology</tspan>
    </text>

    <!-- Main text -->
    <text font-family="Verdana-Bold, Verdana, sans-serif"
          font-size="8"
          font-weight="700"
          fill="#FFFFFF">
      <tspan x="4" y="10">hermeneutic</tspan>
      <tspan x="4" y="20">phenomenology</tspan>
    </text>

    <!-- White check mark -->
    <path d="M92.5 12.7 L97.2 17.1 L105 8.8"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>
