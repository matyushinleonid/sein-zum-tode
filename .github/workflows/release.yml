name: Release

run-name: Release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix, for example 0.1.0
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Promote image and create release
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases must be dispatched from main, got ${GITHUB_REF}." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Validate version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "${RELEASE_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must be a stable semantic version such as 0.1.0." >&2
            exit 1
          fi
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "${RELEASE_VERSION}" != "${project_version}" ]]; then
            echo "Requested version ${RELEASE_VERSION} does not match pyproject.toml version ${project_version}." >&2
            exit 1
          fi
          chart_app_version="$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' deploy/helm/sein-zum-tode/Chart.yaml)"
          if [[ "${RELEASE_VERSION}" != "${chart_app_version}" ]]; then
            echo "Requested version ${RELEASE_VERSION} does not match Chart.yaml appVersion ${chart_app_version}." >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/v${RELEASE_VERSION}"; then
            echo "Tag v${RELEASE_VERSION} already exists." >&2
            exit 1
          fi

      - name: Require successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh run list --workflow ci.yml --commit "${GITHUB_SHA}" --event push --limit 1 --json conclusion --jq '.[0].conclusion // ""')"
          if [[ "${conclusion}" != "success" ]]; then
            echo "Commit ${GITHUB_SHA} has no successful main CI run." >&2
            exit 1
          fi

      - name: Log in to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Promote tested image
        env:
          IMAGE: cr.yandex/${{ vars.YC_REGISTRY_ID }}/${{ vars.YC_REGISTRY_REPOSITORY }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          minor_version="${RELEASE_VERSION%.*}"
          docker buildx imagetools create \
            --tag "${IMAGE}:${RELEASE_VERSION}" \
            --tag "${IMAGE}:${minor_version}" \
            "${IMAGE}:sha-${GITHUB_SHA}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${RELEASE_VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "v${RELEASE_VERSION}" \
            --generate-notes
