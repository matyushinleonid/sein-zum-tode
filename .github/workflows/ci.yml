name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  tests:
    name: lint, types, and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run all checks
        run: make check PYTHON=python VERBOSE=1 USE_WORKERS=0

      - name: Generate coverage report
        run: python -m coverage xml -o coverage.xml

      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v6
        with:
          fail_ci_if_error: true
          files: ./coverage.xml
          use_oidc: true

  publish-image:
    name: Build and push image
    if: github.event_name == 'push'
    needs:
      - tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: cr.yandex/${{ vars.YC_REGISTRY_ID }}/${{ vars.YC_REGISTRY_REPOSITORY }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-lines-of-code-badge:
    name: Publish lines of code badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate lines of code badge
        uses: shadowmoose/GHA-LoC-Badge@1.0.0
        with:
          directory: ./
          badge: ./badge-output/lines-of-code.svg
          patterns: "*.py"
          badge_style: flat

      - name: Publish lines of code badge
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./badge-output
          publish_branch: badges
          force_orphan: true
