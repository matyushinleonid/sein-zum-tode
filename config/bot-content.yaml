version: debug-v2
default_locale: en
locales:
  en:
    help: Mock help response. Use /localization to change language.
    about: 'About this bot: <a href="https://github.com/matyushinleonid/sein-zum-tode">github</a>'
    unsupported: Use /help to learn how to use the bot
    group_unsupported: Group chats are not supported. Please message me directly.
    scream_denied: You can't scream 🤷‍♂️
    notification: "mock notification: {days_left}"
    localization:
      prompt: Choose your language / Выберите язык
      russian: "🇷🇺 RU"
      english: "🇺🇸 EN"
      updated: Language changed to English.
    notification_settings:
      prompt: "Choose a preset or create your own schedule. Current timezone: {timezone}."
      daily: Daily
      weekly: Weekly
      monthly: Monthly
      never: Never
      custom: "✨ Custom schedule"
      custom_prompt: 'Describe when notifications should be sent, including your timezone when relevant. For example: "weekdays at 19:30 Berlin time".'
      custom_mock: Your custom notification schedule has been updated.
      custom_invalid: The proposed schedule could not be applied. Please describe it differently and try again.
      custom_too_frequent: Your desire to remain so close to your own death is commendable, but notifications cannot be sent more than once a day.
      custom_failed: Something went wrong while configuring notifications. Please try again later.
      updated: "Notifications: {frequency}"
    llm:
      limit_exhausted: Your LLM request limit is exhausted.
    prediction:
      failed: Something went wrong. Please try again later.
      mock: "Mock prediction: {answers}"
    questionnaire:
      started: mock conversation started
      completed: thanks for your answers!
      deleted: your answers were deleted from our system
      questions:
        - id: q1
          text: You age and gender?
        - id: q2
          text: What you do for a living, where do you live? Any sports or hobbies?
  ru:
    help: Тестовая справка. Используйте /localization, чтобы изменить язык.
    about: 'О боте: <a href="https://github.com/matyushinleonid/sein-zum-tode">github</a>'
    unsupported: Нажмите /help, чтобы узнать, как пользоваться ботом
    group_unsupported: Групповые чаты не поддерживаются. Напишите боту напрямую.
    scream_denied: Ты не можешь кричать 🤷‍♂️
    notification: "Тестовое уведомление: осталось дней — {days_left}"
    localization:
      prompt: Выберите язык.
      russian: "🇷🇺 RU"
      english: "🇺🇸 EN"
      updated: Язык изменён на русский.
    notification_settings:
      prompt: "Выберите готовое расписание или создайте своё. Текущий часовой пояс: {timezone}."
      daily: Ежедневно
      weekly: Еженедельно
      monthly: Ежемесячно
      never: Никогда
      custom: "✨ Своё расписание"
      custom_prompt: 'Опишите, когда и как часто присылать уведомления, при необходимости указав часовой пояс. Например: «по будням в 19:30 по московскому времени».'
      custom_mock: Ваше расписание уведомлений обновлено.
      custom_invalid: Предложенное расписание не удалось применить. Опишите его иначе и попробуйте ещё раз.
      custom_too_frequent: Ваше желание находиться рядом с собственной смертью столь часто похвально, но мы не можем присылать уведомления чаще одного раза в сутки.
      custom_failed: При настройке уведомлений что-то пошло не так. Попробуйте ещё раз позднее.
      updated: "Уведомления: {frequency}"
    llm:
      limit_exhausted: Лимит запросов к языковой модели исчерпан.
    prediction:
      failed: Что-то пошло не так. Попробуйте ещё раз позднее.
      mock: "Тестовое предсказание: {answers}"
    questionnaire:
      started: Тестовая анкета начата.
      completed: Спасибо за ваши ответы!
      deleted: Ваши ответы удалены из нашей системы.
      questions:
        - id: q1
          text: Ваш возраст и пол?
        - id: q2
          text: Кем вы работаете, где живёте? Есть ли у вас спорт или увлечения?
