services:
  telegram-ingress:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-sein-zum-tode-telegram-ingress}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-console}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_POLLING_TIMEOUT_SECONDS: ${TELEGRAM_POLLING_TIMEOUT_SECONDS:-30}
      TELEGRAM_REQUEST_TIMEOUT_SECONDS: ${TELEGRAM_REQUEST_TIMEOUT_SECONDS:-40}
      TELEGRAM_UPDATE_TTL_SECONDS: ${TELEGRAM_UPDATE_TTL_SECONDS:-3600}
      CONVERSATION_TTL_SECONDS: ${CONVERSATION_TTL_SECONDS:-3600}
      RETRY_INITIAL_DELAY_SECONDS: ${RETRY_INITIAL_DELAY_SECONDS:-1}
      RETRY_MAX_DELAY_SECONDS: ${RETRY_MAX_DELAY_SECONDS:-30}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:?set TEMPORAL_ADDRESS in .env}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-sein-zum-tode}
      TEMPORAL_TLS: ${TEMPORAL_TLS:-false}
      TEMPORAL_ACTIVITY_RETRY_TIMEOUT_SECONDS: ${TEMPORAL_ACTIVITY_RETRY_TIMEOUT_SECONDS:-300}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  telegram-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "sein_zum_tode.bot.worker"]
    environment:
      APP_NAME: ${APP_NAME:-sein-zum-tode-telegram-worker}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-console}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_UPDATE_TTL_SECONDS: ${TELEGRAM_UPDATE_TTL_SECONDS:-3600}
      CONVERSATION_TTL_SECONDS: ${CONVERSATION_TTL_SECONDS:-3600}
      BOT_CONTENT_PATH: ${BOT_CONTENT_PATH:-config/bot-content.yaml}
      DEATH_PREDICTION_CONFIG_PATH: ${DEATH_PREDICTION_CONFIG_PATH:-config/death-prediction.yaml}
      YANDEX_AI_STUDIO_API_KEY: ${YANDEX_AI_STUDIO_API_KEY:-}
      YANDEX_AI_STUDIO_FOLDER_ID: ${YANDEX_AI_STUDIO_FOLDER_ID:-}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:?set TEMPORAL_ADDRESS in .env}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-sein-zum-tode}
      TEMPORAL_TLS: ${TEMPORAL_TLS:-false}
      TEMPORAL_ACTIVITY_RETRY_TIMEOUT_SECONDS: ${TEMPORAL_ACTIVITY_RETRY_TIMEOUT_SECONDS:-300}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-sein_zum_tode}
      POSTGRES_USER: ${POSTGRES_USER:-sein_zum_tode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_SSL: ${POSTGRES_SSL:-false}
      POSTGRES_PGBOUNCER: ${POSTGRES_PGBOUNCER:-false}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-sein_zum_tode}
      POSTGRES_USER: ${POSTGRES_USER:-sein_zum_tode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_SSL: ${POSTGRES_SSL:-false}
      POSTGRES_PGBOUNCER: ${POSTGRES_PGBOUNCER:-false}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-sein_zum_tode}
      POSTGRES_USER: ${POSTGRES_USER:-sein_zum_tode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_FORWARD_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8.0-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
