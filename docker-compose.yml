services:
  telegram-ingress:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-sein-zum-tode-telegram-ingress}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-console}
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: 8000
      HEALTH_HOST: 0.0.0.0
      HEALTH_PORT: 8001
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_POLLING_TIMEOUT_SECONDS: ${TELEGRAM_POLLING_TIMEOUT_SECONDS:-30}
      TELEGRAM_REQUEST_TIMEOUT_SECONDS: ${TELEGRAM_REQUEST_TIMEOUT_SECONDS:-40}
      TELEGRAM_UPDATE_TTL_SECONDS: ${TELEGRAM_UPDATE_TTL_SECONDS:-3600}
      QUESTIONNAIRE_TTL_SECONDS: ${QUESTIONNAIRE_TTL_SECONDS:-3600}
      RETRY_INITIAL_DELAY_SECONDS: ${RETRY_INITIAL_DELAY_SECONDS:-1}
      RETRY_MAX_DELAY_SECONDS: ${RETRY_MAX_DELAY_SECONDS:-30}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:?set TEMPORAL_ADDRESS in .env}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-sein-zum-tode}
      TEMPORAL_TLS: ${TEMPORAL_TLS:-false}
      TEMPORAL_ACTIVITY_RETRY_TIMEOUT_SECONDS: ${TEMPORAL_ACTIVITY_RETRY_TIMEOUT_SECONDS:-300}
      BROADCAST_RECIPIENT_PAGE_SIZE: ${BROADCAST_RECIPIENT_PAGE_SIZE:-100}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS: ${REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS:-5}
      REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-5}
      REDIS_HEALTH_CHECK_INTERVAL_SECONDS: ${REDIS_HEALTH_CHECK_INTERVAL_SECONDS:-30}
      REDIS_TLS: ${REDIS_TLS:-false}
      REDIS_TLS_VERIFY: ${REDIS_TLS_VERIFY:-true}
    restart: unless-stopped
    ports:
      - "${INGRESS_METRICS_FORWARD_PORT:-8000}:8000"
      - "${INGRESS_HEALTH_FORWARD_PORT:-8080}:8001"
    depends_on:
      redis:
        condition: service_healthy

  telegram-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "sein_zum_tode.worker"]
    environment:
      APP_NAME: ${APP_NAME:-sein-zum-tode-telegram-worker}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-console}
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: 8000
      HEALTH_HOST: 0.0.0.0
      HEALTH_PORT: 8001
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_ADMIN_USER_IDS: ${TELEGRAM_ADMIN_USER_IDS:-[]}
      TELEGRAM_UPDATE_TTL_SECONDS: ${TELEGRAM_UPDATE_TTL_SECONDS:-3600}
      UNSUPPORTED_UPDATE_SESSION_TTL_SECONDS: ${UNSUPPORTED_UPDATE_SESSION_TTL_SECONDS:-3600}
      QUESTIONNAIRE_TTL_SECONDS: ${QUESTIONNAIRE_TTL_SECONDS:-3600}
      BOT_CONTENT_PATH: ${BOT_CONTENT_PATH:-config/bot-content.yaml}
      DEATH_PREDICTION_CONFIG_PATH: ${DEATH_PREDICTION_CONFIG_PATH:-config/death-prediction.yaml}
      NOTIFICATION_SCHEDULE_CONFIG_PATH: ${NOTIFICATION_SCHEDULE_CONFIG_PATH:-config/notification-schedule.yaml}
      YANDEX_AI_STUDIO_API_KEY: ${YANDEX_AI_STUDIO_API_KEY:-}
      YANDEX_AI_STUDIO_FOLDER_ID: ${YANDEX_AI_STUDIO_FOLDER_ID:-}
      YANDEX_AI_STUDIO_ENABLE_SERVER_DATA_LOGGING: ${YANDEX_AI_STUDIO_ENABLE_SERVER_DATA_LOGGING:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SOCKS5_PROXY_HOST: ${SOCKS5_PROXY_HOST:-}
      SOCKS5_PROXY_PORT: ${SOCKS5_PROXY_PORT:-}
      SOCKS5_PROXY_USERNAME: ${SOCKS5_PROXY_USERNAME:-}
      SOCKS5_PROXY_PASSWORD: ${SOCKS5_PROXY_PASSWORD:-}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:?set TEMPORAL_ADDRESS in .env}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-sein-zum-tode}
      TEMPORAL_TLS: ${TEMPORAL_TLS:-false}
      TEMPORAL_ACTIVITY_RETRY_TIMEOUT_SECONDS: ${TEMPORAL_ACTIVITY_RETRY_TIMEOUT_SECONDS:-300}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS: ${REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS:-5}
      REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-5}
      REDIS_HEALTH_CHECK_INTERVAL_SECONDS: ${REDIS_HEALTH_CHECK_INTERVAL_SECONDS:-30}
      REDIS_TLS: ${REDIS_TLS:-false}
      REDIS_TLS_VERIFY: ${REDIS_TLS_VERIFY:-true}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-sein_zum_tode}
      POSTGRES_USER: ${POSTGRES_USER:-sein_zum_tode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_TLS_MODE: ${POSTGRES_TLS_MODE:-disable}
      POSTGRES_PGBOUNCER: ${POSTGRES_PGBOUNCER:-false}
      POSTGRES_CONNECT_TIMEOUT_SECONDS: ${POSTGRES_CONNECT_TIMEOUT_SECONDS:-10}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-5}
      POSTGRES_MAX_OVERFLOW: ${POSTGRES_MAX_OVERFLOW:-10}
      POSTGRES_POOL_TIMEOUT_SECONDS: ${POSTGRES_POOL_TIMEOUT_SECONDS:-30}
      POSTGRES_POOL_RECYCLE_SECONDS: ${POSTGRES_POOL_RECYCLE_SECONDS:--1}
    restart: unless-stopped
    ports:
      - "${WORKER_METRICS_FORWARD_PORT:-8001}:8000"
      - "${WORKER_HEALTH_FORWARD_PORT:-8081}:8001"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-sein_zum_tode}
      POSTGRES_USER: ${POSTGRES_USER:-sein_zum_tode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_TLS_MODE: ${POSTGRES_TLS_MODE:-disable}
      POSTGRES_PGBOUNCER: ${POSTGRES_PGBOUNCER:-false}
      POSTGRES_CONNECT_TIMEOUT_SECONDS: ${POSTGRES_CONNECT_TIMEOUT_SECONDS:-10}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-5}
      POSTGRES_MAX_OVERFLOW: ${POSTGRES_MAX_OVERFLOW:-10}
      POSTGRES_POOL_TIMEOUT_SECONDS: ${POSTGRES_POOL_TIMEOUT_SECONDS:-30}
      POSTGRES_POOL_RECYCLE_SECONDS: ${POSTGRES_POOL_RECYCLE_SECONDS:--1}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-sein_zum_tode}
      POSTGRES_USER: ${POSTGRES_USER:-sein_zum_tode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_FORWARD_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8.0-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
